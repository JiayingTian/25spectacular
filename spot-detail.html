        // 解析URL参数获取景点ID
        function getSpotId() {
            const urlParams = new URLSearchParams(window.location.search);
            return parseInt(urlParams.get('id')) || 1;
        }

        // 生成星级评分HTML
        function generateStarRating(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;
            let starsHTML = '';
            
            for (let i = 0; i < fullStars; i++) {
                starsHTML += '<i class="fas fa-star"></i>';
            }
            
            if (hasHalfStar) {
                starsHTML += '<i class="fas fa-star-half-alt"></i>';
            }
            
            const totalStars = 5;
            const emptyStars = totalStars - fullStars - (hasHalfStar ? 1 : 0);
            for (let i = 0; i < emptyStars; i++) {
                starsHTML += '<i class="far fa-star"></i>';
            }
            
            return starsHTML;
        }

        // 加载景点详情（含省份显示）
        function loadSpotDetail() {
            const spotId = getSpotId();
            const spot = spotDetailData.find(item => item.id === spotId);
            
            if (!spot) {
                document.querySelector('.spot-title').textContent = '景点不存在';
                document.getElementById('spot-province').textContent = '';
                document.querySelector('.spot-description').textContent = '抱歉，你访问的景点不存在或已下架～';
                return;
            }
            
            // 填充景点信息（含省份）
            document.querySelector('.spot-title').textContent = spot.name;
            document.getElementById('spot-province').textContent = spot.province;
            document.getElementById('spot-detail-img').src = spot.img;
            document.getElementById('spot-detail-img').alt = spot.name;
            document.getElementById('spot-description').textContent = spot.description;
            document.getElementById('spot-location').textContent = spot.location;
            document.getElementById('spot-time').textContent = spot.time;
            document.getElementById('spot-ticket').textContent = spot.ticket;
            document.getElementById('spot-popularity').textContent = spot.popularity;
            
            // 填充星级评分
            const starRatingHTML = generateStarRating(spot.rating);
            document.getElementById('spot-rating-detail').innerHTML = `
                ${starRatingHTML}
                <span>${spot.rating}（基于用户真实评价）</span>
            `;
            
            // 加载对应景点的用户评价
            loadSpotReviews(spot.name);
        }

        // 加载对应景点的用户评价
        function loadSpotReviews(spotName) {
            const existingReviews = JSON.parse(localStorage.getItem('spotReviews')) || [];
            const spotReviews = existingReviews.filter(review => 
                review.spotName.toLowerCase() === spotName.toLowerCase()
            );
            
            const reviewsList = document.getElementById('reviews-list');
            
            if (spotReviews.length === 0) {
                reviewsList.innerHTML = `
                    <div class="no-reviews">
                        <i class="fas fa-comment-slash"></i>
                        <p>暂无${spotName}的评价，快来成为第一个分享体验的人吧～</p>
                    </div>
                `;
                return;
            }
            
            let reviewsHTML = '';
            spotReviews.forEach(review => {
                const reviewStarRating = generateStarRating(review.score);
                reviewsHTML += `
                    <div class="review-item">
                        <div class="review-header">
                            <div class="review-spot-name">${review.spotName}</div>
                            <div class="review-date">${review.date}</div>
                        </div>
                        <div class="review-rating">${reviewStarRating}</div>
                        <div class="review-content">${review.content}</div>
                    </div>
                `;
            });
            
            reviewsList.innerHTML = reviewsHTML;
        }

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', function() {
            loadSpotDetail();

            // 评价区折叠/展开功能
            const toggleBtn = document.getElementById('review-toggle-btn');
            const reviewsContainer = document.getElementById('reviews-list-container');
            let isExpanded = true;

            toggleBtn.addEventListener('click', function() {
                isExpanded = !isExpanded;
                if (isExpanded) {
                    reviewsContainer.style.maxHeight = '500px';
                    this.innerHTML = '<span>收起评价</span><i class="fas fa-chevron-up"></i>';
                    this.classList.remove('collapsed');
                } else {
                    reviewsContainer.style.maxHeight = '0';
                    this.innerHTML = '<span>展开评价</span><i class="fas fa-chevron-up"></i>';
                    this.classList.add('collapsed');
                }
            });
        });
    </script>
</body>
</html>
